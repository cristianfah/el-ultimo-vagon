          LIGHT: Only practical sources. The reading lamp above the window of the sleeping passenger's row, upper left of frame, grazing the hip: amber 2700K, medium; it enters through the opening of the jacket, warms the wood of the grip and leaves a thin highlight on the blued steel of the cylinder. The lamp of the opposite row, upper right: amber 2700K, very low; it barely separates the grey cloth from the background. Contrast ratio 5:1; the inside of the jacket falls into shadow and the revolver appears as it enters the light.

          TEXTURE: Worn blued steel and dark wood with a used finish. Worn brown leather holster with stitching. The cylinder is closed; no bullets visible anywhere, no cartridge loops and no ammunition on the belt. No markings, engravings or logos on the revolver. No hand in frame. Grey wool jacket with natural folds, plain metal buttons, no insignia.

          FINISH: Kodak Vision3 500T film scan look, fine organic grain, soft natural micro-contrast, no digital sharpening, no HDR look. Color separation limited to warm amber and near-black. No text, no logos.
      keyframe_entrada:
        motor: gpt_image_2_5_edit
        endpoint: openai/gpt-image-2.5/flare/edit
        params: { image_size: { width: 720, height: 1280 }, quality: high, num_images: 2 }
        referencias: ["Image 1 = keyframe c01_p10 (aprobado)"]
        texto: |
          Edit Image 1, the approved frame. Change only the jacket: the right side of the grey jacket is barely open, just enough to show a strip of the black leather belt; the revolver, its grip and the holster are not visible yet, still covered by the cloth. Keep everything else exactly as in Image 1: camera, framing, 65mm lens and focus, the amber light from the upper left, the plain metal buttons, grain and color. No hand in frame. No text, no logos.

resumen_produccion:
  # Asistente de dirección. Tarifas: GPT Image 2.5 edit ~0,05 USD por imagen (high), Nano Banana Pro edit 0,15 USD, H3 Max 480P 0,05 USD/s (la prueba bajó de 768P a 480P el 30-sep; los keyframes que faltaban, a 720×1280).
  planos_por_motor:
    keyframe: { gpt_image_2_5_edit: 9, nano_banana_pro_edit: 1 }
    video: { h3_max: 10, kling: 0 }
  keyframes: 36
  keyframes_desglose: "30 principales (10 planos × 3 tomas) + 6 variantes de entrada para primer y último fotograma (c01_p01, c01_p05 y c01_p10, 2 tomas cada una, editando el keyframe aprobado). Cristian aprueba 13: uno por plano y las 3 variantes."
  bloques: 6
  segundos_video: 74
  segundos_desglose: "37 s por pasada (cinco bloques de 5 s y uno de 12 s) × 2 tomas por bloque, con seed distinto."
  costo_keyframes_usd: 2.10
  costo_keyframes_desglose: "GPT Image: 27 principales × 0,05 = 1,35 y 6 variantes × 0,05 = 0,30. Nano Banana Pro: 3 × 0,15 = 0,45."
  costo_video_usd: 3.82
  costo_video_desglose: "Por pasada a 480P: cinco bloques de 5 s × 0,25 = 1,25 y c01_b03 (12 s) = 0,60 + 0,06 de referencias extra = 0,66. Total por pasada, 1,91; con 2 tomas por bloque, 3,82."
  costo_total_usd: 5.92
  orden_generacion: "1) Keyframes: c01_p01 → c01_p02 (con p01 aprobado); c01_p03 (ancla) → c01_p04, c01_p06, c01_p05, c01_p07, c01_p08, c01_p09 (con p03 aprobado) → c01_p10 (con p09 aprobado); al final, las variantes de entrada de p01, p05 y p10. 2) Aprobación de Cristian. 3) Video: c01_b03 primero (es el que más arriesga), luego c01_b01, c01_b02, c01_b04, c01_b05 y c01_b06."
  bloqueos:
    - "Todos los assets están en estado provisorio. La regla es que no se genera con assets sin aprobar: esta prueba se autoriza como exploración y ningún keyframe se da por final."
    - "boletos está pendiente (hc31) y el pasajero dormido de c01_p09 no tiene referencia. Bloquean c01_p09 salvo que Cristian acepte generarlos solo con prompt."
    - "Falta la mano derecha de Diego mojada, con manchas y el puño empapado, vista desde adentro con luz roja (c01_p01). La hoja de Diego está seca y limpia."
    - "Las puertas no coinciden entre placas (hc22, alerta del Director de fotografía en c01_p08). Se mitiga con loc_ultimo_vagon_rojo como referencia de forma, pero hay que unificarlas en las placas definitivas."
    - "Las placas miden 608×1088. Para la prueba a 480P bastan keyframes de 720×1280; en la versión final (768P o 1080P) se piden a no menos de 1088×1920."
    - "No hay variante de Martina después de la carrera (mechones y sudor, hc10) ni placa del vagón de pasajeros con luz roja para el fondo de c01_p01. Por ahora salen del prompt."
    - "No hay voz de Martina en ElevenLabs para usar target_audio_url en c01_b02. No bloquea: el «Diego…» se genera con el video y se puede reemplazar en post."
