planos:
  # ============================ COLD OPEN ============================
  - id: c01_p01
    escena: cold_open
    tiempo: "0:00–0:01"
    duracion_s: 1

    # --- Director ---
    tipo_plano: inserto
    accion: "Desde afuera, una palma abierta con manchas oscuras golpea dos veces la ventanita de la puerta y queda apoyada en el vidrio."
    intencion: "Momento fuerte: sobresalto en el primer fotograma. Alguien herido quiere entrar."
    informacion: "Hay una persona herida afuera de una puerta cerrada, golpeando para que le abran."
    actuacion: "La mano no araña ni se crispa: golpea con ritmo de persona, dos golpes, y la palma queda pegada al vidrio con los dedos abiertos."
    audio:
      sfx: ["dos golpes secos de palma contra el vidrio", "traqueteo del tren de fondo"]
    personajes: [diego]
    locacion: loc_ultimo_vagon_rojo
    corte: "Se corta con la palma quieta en el vidrio para pasar a quien la mira desde adentro (c01_p02). Es el mismo plano de la escena 4 (ver c01_p02)."

    # --- Director de fotografía ---
    camara:
      altura: "A la altura de la ventanita (unos 1,65 m), a nivel, sin picado ni contrapicado."
      posicion: "Adentro del último vagón, a unos 2,5 m de la puerta, apenas a la izquierda del eje de la ventanita y casi frontal al vidrio: es la distancia y el lado desde donde mira Martina."
      movimiento: "Fija: \"locked-off, static camera\". Solo se mueve la mano; la cámara no reacciona a los golpes."
    lente:
      focal_mm: 65
      apertura: T2
      foco: "En la palma y en las manchas secas del vidrio, que están en el mismo plano. El pasillo rojo del otro lado queda muy desenfocado; el marco metálico de la ventanita, apenas blando."
    luz:
      dominante: "Rojo de emergencia #B3001B de los dos lados de la puerta; lámparas ámbar apagadas (hc01)."
      fuentes:
        - { fuente: "Tubo fluorescente del techo, justo sobre la puerta (adentro)", posicion: "Arriba del cuadro, fuera de campo, casi vertical sobre el vidrio", color: "Blanco frío #E8F1F2, unos 6500 K", intensidad: "Media, dura; encendido fijo, sin parpadeo. Cae sobre la palma a través del vidrio y deja un brillo frío en la piel mojada y en el borde superior del marco" }
        - { fuente: "Luces rojas de emergencia del pasillo del otro lado", posicion: "Detrás del vidrio, al fondo del pasillo vacío", color: "Rojo #B3001B", intensidad: "Baja; contraluz que recorta los dedos y llena el fondo de rojo desenfocado" }
        - { fuente: "Luces rojas bajas del último vagón, a ras del piso", posicion: "Abajo, fuera de campo, en la base de los asientos a ambos lados de la puerta", color: "Rojo #B3001B", intensidad: "Muy baja; solo tiñe de rojo la chapa de la puerta alrededor del vidrio" }
      contraste: "8:1, un punto subexpuesto. La palma es lo más claro del cuadro; las manchas se leen negras bajo el rojo."
    zona_segura_9x16: "La ventanita ocupa el ancho central con su marco metálico a los lados; su borde superior queda cerca de y≈250 y el inferior sale por abajo del cuadro. La palma va en la mitad inferior izquierda del vidrio visible (centro hacia x≈430, y≈1050); la muñeca y el comienzo del puño gris empapado deben quedar por encima de y≈1470, y el resto de la manga sigue hacia la zona de la interfaz. La mitad superior del vidrio (y≈250–900) queda libre, con el pasillo rojo vacío: ahí aparece la cara de Diego cuando el plano se reutiliza a las 0:45. Sin texto en pantalla."

    # --- Continuista ---
    continuidad:
      entrada:
        - "Ventanita vista desde adentro del último vagón, con manchas oscuras secas en la esquina superior derecha y todavía sin huella de palma."
        - "Detrás del vidrio, el pasillo del otro lado iluminado de rojo y vacío."
        - "La mano derecha de Diego, abierta y mojada, a pocos centímetros del vidrio; el puño de la manga gris claro empapado de oscuro entra por el borde inferior del cuadro."
      salida:
        - "La palma derecha de Diego queda apoyada en la mitad inferior izquierda del vidrio, con los dedos abiertos hacia arriba y el pulgar hacia la derecha del cuadro."
        - "Alrededor de la palma, el vidrio queda manchado de oscuro y de agua."
        - "No se ven la cara de Diego ni infectados."
      eje: "Cámara adentro del último vagón, del lado izquierdo de Martina, mirando de frente la puerta (hacia el frente del tren). Es el contracampo de c01_p02: la mano está donde mira Martina. Cuando aparezca la cara de Diego en la escena 4, él mira hacia la derecha del cuadro."
      hechos: [hc01, hc17, hc19, hc20, hc21, hc22, hc23, hc24]
      alertas:
        - "Director: el guion no dice qué mano es ni si la sangre de la mano viene del corte del brazo. Tiene que calzar con la manga oscura de Diego a las 0:45 y con el brazo que muestra a las 0:51."
        - "Continuista: propongo que sea la mano derecha y que la sangre baje del corte del antebrazo derecho, con el puño de esa manga dentro del cuadro (hc19, hc20). Así calza con la manga oscura de las 0:45 y con el brazo que muestra a las 0:51, y le da a Martina algo reconocible además de la palma."
        - "Continuista: como este plano es el de las 0:45, el vidrio ya tiene las manchas del infectado de las 0:26 (hc23). Si se genera limpio, al reutilizarlo contradice la escena 2. La huella que deja la palma tiene que seguir en el vidrio en todos los planos de la ventanita hasta el final del capítulo."
        - "Continuista: vista desde adentro, una mano derecha apoyada con la palma en el vidrio tiene el pulgar hacia la derecha del cuadro (hc21). Los modelos suelen dibujar el dorso o invertir la mano: Control de calidad lo tiene que revisar."
        - "Continuista: esto es una excepción a la regla de sangre seca, porque el guion dice «manga empapada». En la manga y en la palma de Diego la sangre está húmeda, pero sigue casi negra (#1A0505) y bajo luz roja se lee negra. En el prompt va «dark red-black stains», nunca «blood»."
        - "Asistente de dirección: falta la referencia de la mano de Diego desde afuera y bajo luz roja. La hoja de Diego está seca, con luz neutra y las mangas limpias, así que el keyframe tiene que inventar la palma mojada, las manchas (hc20) y el puño empapado (hc19). Propongo aprobar primero una hoja de detalle de la mano derecha y el puño; si no, Control de calidad revisa la mano en las 3 tomas."
        - "Asistente de dirección: en la placa loc_ultimo_vagon_rojo el vidrio de la ventanita está limpio y negro. El keyframe tiene que agregar las manchas secas arriba a la derecha (hc23) y el pasillo rojo vacío del otro lado (hc24)."
        - "Asistente de dirección: este plano lleva dos keyframes: el principal (salida, palma apoyada) y una variante de entrada que sale de editar el principal ya aprobado (mano separada del vidrio, sin huella). Van como último y primer fotograma de c01_b01."
        - "Prompter: el Director de fotografía no declara cuerpo de cámara ni serie de lentes. En todos los keyframes uso los del ejemplo aprobado de la plantilla de rodaje (ARRI Alexa 35 y Cooke S4 esféricos), con la focal y la apertura de cada plano. Si el DP prefiere otros, se cambian en todos a la vez."
        - "Prompter: las variantes de entrada (keyframe_entrada de c01_p01, c01_p05 y c01_p10) son prompts de edición cortos sobre el keyframe aprobado, no los siete bloques: cambian solo lo que difiere entre entrada y salida, para no arriesgar el resto del cuadro. Llevan num_images: 2, según las 2 tomas por variante del resumen del Asistente."
        - "Prompter: los keyframes miden entre 380 y 580 palabras (el ejemplo aprobado de la plantilla, unas 370), y la plantilla advierte que GPT Image se deforma con prompts largos. Los más largos son c01_p01, c01_p02, c01_p03 y c01_p09, porque cada fuente de luz del DP y cada hecho frágil entra completo. Si en la primera tanda GPT deforma la mano o la composición, se corre el mismo prompt en Nano Banana Pro, como pide la plantilla, antes de recortar campos."

    # --- Asistente de dirección ---
    bloque: c01_b01
    referencias: [diego, loc_ultimo_vagon_rojo]
    motor_keyframe: gpt_image_2_5_edit
    motor_video: h3_max
    metodo_video: FL
    tomas_objetivo: 3

    # --- Prompter ---
    prompts:
      keyframe:
        motor: gpt_image_2_5_edit
        endpoint: openai/gpt-image-2.5/flare/edit
        params: { image_size: { width: 1088, height: 1920 }, quality: high, num_images: 3 }
        referencias: ["Image 1 = diego (hoja)", "Image 2 = loc_ultimo_vagon_rojo"]
        texto: |
          FILM STILL: Film still from a feature film, not an illustration. Image 1 is Diego: match his skin tone, his hands and his light grey canvas jacket; only his right hand and the cuff of his right sleeve are in frame. Image 2 is the last carriage under red emergency light: match its connecting door, the vertical rectangular window with a plain metal frame at adult head height, and the fluorescent tube above the door.

          MOMENT: Seen from inside the last carriage, a man's right hand has just knocked twice on the door window from outside and now rests flat on the glass: palm toward camera, fingers spread and pointing up, thumb toward frame right. Only the palm is visible through the glass. Behind it, the corridor on the other side is lit red and empty. No face, no other people.

          COMPOSITION: 9:16 vertical insert. Camera inside the carriage at window height, about 1.65 m, level, 2.5 m from the door, slightly left of the window's axis and almost square to the glass. The window fills the central width, with its metal frame at both sides; its top edge sits about 13% from the top of the frame and its bottom edge runs out of the bottom of the frame. The palm sits in the lower-left half of the visible glass, centred about 40% from the left and 55% from the top. The wrist and the start of the soaked cuff stay above 77% from the top; the sleeve continues out of the bottom edge. The upper half of the glass, from 13% to 47% from the top, stays empty, showing only the red corridor.

          LENS: Shot on ARRI Alexa 35 with a Cooke S4 65mm spherical lens at T2. Focus on the palm and on the dry stains on the glass, which lie in the same plane. The red corridor beyond is heavily out of focus; the metal window frame is slightly soft. No anamorphic streaks.

          LIGHT: Only practical sources. A ceiling fluorescent tube just above the door, inside, out of frame and almost vertical over the glass: cold white 6500K (#E8F1F2), medium and hard, steady with no flicker; it falls on the palm through the glass and leaves a cold sheen on the wet skin and on the top edge of the frame. Red emergency lights (#B3001B) at the far end of the empty corridor behind the glass, low: a backlight that rims the fingers and fills the background with out-of-focus red. Low red emergency lights at floor level inside the carriage, out of frame below, very low: they only tint the metal of the door around the window. The amber reading lamps are off. Contrast ratio 8:1, one stop underexposed. The palm is the brightest thing in the frame; the stains read black under the red.

          TEXTURE: The hand is wet with rain. Wet dark red-black stains run down from the wrist onto the heel of the palm and the base of the fingers, mixed with rainwater; the fingertips are almost clean. No rings, watch or bracelets. The light grey cuff is soaked dark red-black. Around the palm, the glass is smeared with dark marks and water. Dry dark stains in the upper-right corner of the glass. Nothing else on the glass.

          FINISH: Kodak Vision3 500T film scan look, fine organic grain, soft natural micro-contrast, no digital sharpening, no HDR look. Color separation limited to deep red, cold cyan-white and near-black. No text, no logos.
      keyframe_entrada:
        motor: gpt_image_2_5_edit
        endpoint: openai/gpt-image-2.5/flare/edit
        params: { image_size: { width: 1088, height: 1920 }, quality: high, num_images: 2 }
        referencias: ["Image 1 = keyframe c01_p01 (aprobado)"]
        texto: |
          Edit Image 1, the approved frame. Change only the hand and the glass around it: the same wet right hand, open, now hangs a few centimetres behind the glass without touching it, palm toward camera, fingers spread and pointing up, thumb toward frame right. Remove the palm print and the fresh dark smears and water around it; the glass keeps only the dry dark stains in the upper-right corner. Keep everything else exactly as in Image 1: camera position, framing, 65mm lens and focus, the red and cold-white light, the empty red corridor, the soaked light grey cuff entering from the bottom edge, the dark red-black stains on the hand, grain and color. No text, no logos.

    # --- Control de calidad ---
    revision:
      - toma: "keyframe 0"
        veredicto: "descartar"
        problema: "Orientación de la mano correcta (palma, pulgar a la derecha, hc21), pero: (1) hc23: el vidrio está embarrado en casi toda la mitad izquierda y el centro, no solo alrededor de la palma; con la mancha grande de arriba a la derecha, el vidrio entero se lee como pintura. (2) hc20: las manchas suben hasta las falanges medias de índice y medio. (3) hc19 y hc17: el puño gris solo tiene regueros; no está empapado de oscuro del codo al puño y se ve seco. (4) 9:16: el borde superior de la ventanita queda al 2 % (se pedía al 13 %) y el inferior no sale por abajo del cuadro. (5) hc24 y luz: detrás del vidrio se ve un tubo blanco frío en el techo del pasillo, que debe ser solo rojo."
        correccion_unica: "No se corrige esta toma: la base para la siguiente pasada es el keyframe 1. Si se regenera desde cero, mismo prompt con otra seed."
      - toma: "keyframe 1"
        veredicto: "corregir"
        problema: "Es la más cercana al plano: palma derecha con pulgar a la derecha (hc21), posición en la mitad inferior izquierda (x≈34 %, y≈53 %), muñeca por encima del 77 %, manchas en el talón de la palma y la base de los dedos con las puntas limpias (hc20), manchas secas arriba a la derecha y pasillo rojo vacío (hc23, hc24). Falla: (1) hc19 (frágil) y hc17: la manga gris tiene regueros sueltos pero no está empapada de casi negro del codo al puño, y se ve seca, sin lluvia; es lo que Martina reconoce. (2) hc22: la ventanita es más ancha que en la placa loc_ultimo_vagon_rojo (proporción ≈0,58 contra ≈0,41); si se aprueba, este keyframe fija la forma para todos los planos de la ventanita. (3) El borde inferior del vidrio queda dentro del cuadro (al 86 %) en vez de salir por abajo. (4) El tubo fluorescente entra arriba del cuadro (0–3 %); queda en la zona de la interfaz y es fuente visible, se tolera. (5) Bajo el blanco frío, las manchas de la mano se leen rojo oscuro, no casi negras."
        correccion_unica: "Editar el keyframe 1 con openai/gpt-image-2.5/flare/edit (Image 1 = keyframe 1), cambiando solo la manga: «Edit Image 1. Change only the sleeve: the light grey canvas sleeve of the right arm is soaked through with dark red-black stains from the elbow to the edge of the cuff, and wet with rain, darker and heavier where the fabric folds at the wrist. Keep the hand, the stains on the hand, the glass, the stains on the glass, the window, the red corridor, the light, framing, focus, grain and color exactly as in Image 1. No text, no logos.»"
      - toma: "keyframe 2"
        veredicto: "corregir"
        problema: "Orientación correcta (hc21) y manchas secas arriba a la derecha con pasillo rojo vacío (hc23, hc24). Falla: (1) hc19 (frágil) y hc17: igual que las otras, la manga gris está salpicada pero no empapada del codo al puño, y se ve seca. (2) hc20: las manchas suben hasta la mitad de los dedos. (3) 9:16: el borde superior de la ventanita queda al 3 % (se pedía al 13 %) y el inferior dentro del cuadro. (4) Más subexpuesta que la 1; el brillo frío en la piel mojada es débil."
        correccion_unica: "Misma edición de manga que el keyframe 1, sobre esta imagen, solo si Cristian la prefiere a la 1; si no, no se corrige."
      - toma: "recomendacion"
        recomienda: "ninguna tal cual; aprobar el keyframe 1 después de la edición de manga"
        motivo: "La 1 es la única con las puntas de los dedos limpias, el vidrio limpio fuera de la palma y margen superior; solo le falta la manga empapada (hc19), que se corrige editándola sin tocar el resto."

  - id: c01_p02
    escena: cold_open
    tiempo: "0:01–0:02"
    duracion_s: 1

    # --- Director ---
    tipo_plano: PP
    accion: "Adentro, bajo la luz de la escena 4, Martina mira la ventanita y dice «Diego…» casi sin voz."
    intencion: "Plantear la pregunta del capítulo en un segundo: ella conoce a esa persona. ¿Quién es y por qué no le abre?"
    informacion: "La persona herida se llama Diego y Martina lo reconoce solo por la mano."
    actuacion: "Quietud total. No parpadea; los labios apenas se separan para decir el nombre y se le corta el aire."
    audio:
      dialogo: ["MARTINA (casi sin voz): «Diego…»"]
      sfx: ["un tercer golpe en el vidrio, fuera de campo", "en el último instante, silencio seco y entrada anticipada de la lluvia y el traqueteo de la escena 1"]
    personajes: [martina]
    locacion: loc_ultimo_vagon_rojo
    corte: "Se corta sobre el nombre, sin respuesta, con un corte seco a la escena 1 (c01_p03): el salto de veinte minutos hacia atrás lo hace el corte, sin texto. Sonido: al cortar cae el silencio y la lluvia y el traqueteo entran antes que la imagen. Decisión: c01_p01 y c01_p02 son los mismos planos de la escena 4. Se generan una sola vez y se vuelven a usar a las 0:45, justo antes de que aparezca la cara de Diego, para que el público reconozca el momento del inicio."

    # --- Director de fotografía ---
    camara:
      altura: "A la altura de los ojos de Martina de pie, a nivel."
      posicion: "A su izquierda y un poco por delante de ella, hacia la puerta, a 1,2 m, pegada a su línea de mirada: ella mira hacia la izquierda del cuadro, casi rozando el lente."
      movimiento: "Cámara en mano casi fija: \"handheld, subtle breathing, no reframing\"."
    lente:
      focal_mm: 85
      apertura: T1.8
      foco: "En el ojo izquierdo de Martina (el más cercano a cámara). Oreja, cola de pelo y fondo fuera de foco; el último vagón se reduce a manchas rojas de las luces bajas, sin figuras reconocibles."
    luz:
      dominante: "Rojo de emergencia #B3001B; lámparas ámbar apagadas (hc01). Mismas fuentes y dirección que c01_p01."
      fuentes:
        - { fuente: "Luces rojas bajas de emergencia, a ras del piso en la base de los asientos", posicion: "Abajo, a ambos lados de ella, fuera de campo", color: "Rojo #B3001B", intensidad: "Media; rebotada en el piso, sube a la cara desde abajo y la llena de rojo, sobre todo del lado derecho de ella" }
        - { fuente: "Tubo fluorescente del techo sobre la puerta", posicion: "Delante de ella y arriba, a unos 3 m, fuera de campo hacia la izquierda del cuadro", color: "Blanco frío #E8F1F2, unos 6500 K", intensidad: "Baja, encendido fijo sin parpadeo; deja un brillo frío en el sudor de la frente, un reflejo en los ojos y un filo en los mechones sueltos" }
        - { fuente: "Luces rojas bajas del fondo del vagón", posicion: "Detrás de ella, hacia la cola", color: "Rojo #B3001B", intensidad: "Baja; solo bokeh en el fondo" }
      contraste: "8:1, un punto subexpuesto, igual que c01_p01. El lado de la cara que da a la cola cae casi a negro."
    zona_segura_9x16: "Cara en el tercio medio, un poco a la derecha del centro para dejar aire hacia la izquierda, adonde mira. Ojos cerca de y≈700; el cuello del suéter termina antes de y≈1470 para que el subtítulo «Diego…» caiga sobre fondo oscuro. Arriba (0–220 px) solo pelo y fondo rojo desenfocado. Sin tarjeta."

    # --- Continuista ---
    continuidad:
      entrada:
        - "Martina de pie en el último vagón, sola en el cuadro, a unos tres metros de la puerta y de frente a ella, mirando la ventanita."
        - "Luz roja de emergencia en la cara; no hay luz ámbar."
        - "Pelo recogido en cola baja con mechones sueltos alrededor de la cara y brillo de sudor en la frente, por la carrera de las 0:23."
        - "Suéter crema, seco y sin manchas."
        - "El celular está en su mano izquierda, abajo, fuera del cuadro."
        - "Al fondo, detrás de ella, el último vagón en rojo y desenfocado, sin personas reconocibles."
      salida:
