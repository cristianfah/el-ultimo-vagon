resumen_produccion:
  # Asistente de dirección. Tarifas: GPT Image 2.5 edit ~0,05 USD por imagen (high), Nano Banana Pro edit 0,15 USD, H3 Max 768P 0,08 USD/s.
  planos_por_motor:
    keyframe: { gpt_image_2_5_edit: 9, nano_banana_pro_edit: 1 }
    video: { h3_max: 10, kling: 0 }
  keyframes: 36
  keyframes_desglose: "30 principales (10 planos × 3 tomas) + 6 variantes de entrada para primer y último fotograma (c01_p01, c01_p05 y c01_p10, 2 tomas cada una, editando el keyframe aprobado). Cristian aprueba 13: uno por plano y las 3 variantes."
  bloques: 6
  segundos_video: 74
  segundos_desglose: "37 s por pasada (cinco bloques de 5 s y uno de 12 s) × 2 tomas por bloque, con seed distinto."
  costo_keyframes_usd: 2.10
  costo_keyframes_desglose: "GPT Image: 27 principales × 0,05 = 1,35 y 6 variantes × 0,05 = 0,30. Nano Banana Pro: 3 × 0,15 = 0,45."
  costo_video_usd: 6.04
  costo_video_desglose: "Por pasada: cinco bloques de 5 s × 0,40 = 2,00 y c01_b03 (12 s) = 0,96 + 0,06 de referencias extra = 1,02. Total por pasada, 3,02; con 2 tomas por bloque, 6,04."
  costo_total_usd: 8.14
  orden_generacion: "1) Keyframes: c01_p01 → c01_p02 (con p01 aprobado); c01_p03 (ancla) → c01_p04, c01_p06, c01_p05, c01_p07, c01_p08, c01_p09 (con p03 aprobado) → c01_p10 (con p09 aprobado); al final, las variantes de entrada de p01, p05 y p10. 2) Aprobación de Cristian. 3) Video: c01_b03 primero (es el que más arriesga), luego c01_b01, c01_b02, c01_b04, c01_b05 y c01_b06."
  bloqueos:
    - "Todos los assets están en estado provisorio. La regla es que no se genera con assets sin aprobar: esta prueba se autoriza como exploración y ningún keyframe se da por final."
    - "boletos está pendiente (hc31) y el pasajero dormido de c01_p09 no tiene referencia. Bloquean c01_p09 salvo que Cristian acepte generarlos solo con prompt."
