    loc_ultimo_vagon_rojo: { estado: provisorio, ref: "https://v3b.fal.media/files/b/0aac7306/XpxNO2Gqn7XDT2FCoXTCM_VIdKpyHY.png", nota: "Luz de emergencia (hc01). Vista hacia la puerta con ventanita (hc22)." }
