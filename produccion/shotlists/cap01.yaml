# Prueba del equipo técnico: solo el cold open (0:00–0:02) y la escena 1 (0:02–0:16), basado en guion/cap01/cap01_v3.md.
# Están los campos del Director y del Continuista. Faltan Director de fotografía, Asistente de dirección, Prompter y Pipeline.

capitulo: 1
guion: guion/cap01/cap01_v3.md
duracion_objetivo_s: 90
estado: desglose

assets:
  # Provisorios de prueba (GPT Image 2.5 Flare, fal). No son casting final. Prompts en produccion/prompts/sheets_provisorios.md
  personajes:
    martina: { estado: provisorio, hoja: "https://v3b.fal.media/files/b/0aac72dd/kKqOI8dkCPWyyqtAIJ7_T_uWqSgH9g.png", hechos: [hc09, hc10] }
    tomas: { estado: provisorio, hoja: "https://v3b.fal.media/files/b/0aac7306/LTe0Ioos3fCiPpVZCkP3i_lzRVqClL.png", hechos: [hc12] }
    diego: { estado: provisorio, hoja: "https://v3b.fal.media/files/b/0aac72dd/sBwFDZvRL1AtoeQmMcujf_mBTAVWnO.png", hechos: [hc17] }
    carmen: { estado: provisorio, hoja: "https://v3b.fal.media/files/b/0aac7306/e5SqCDZcMBWKDZ6RI_s9m_ajO1qadM.png", hechos: [hc13] }
    ivan: { estado: provisorio, hoja: "https://v3b.fal.media/files/b/0aac7306/GudHSkePi5h2Q_rvf1AF2_0n6RAU6D.png", hechos: [hc15] }
    don_hugo: { estado: provisorio, hoja: "https://v3b.fal.media/files/b/0aac7306/NYbHUFUUY4BhNBpgL2KN4_4Lrmuecr.png", hechos: [hc16] }
